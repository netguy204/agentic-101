# How the voice says this course's words.
# Chunk: docs/chunks/platform_module_contract - Module pronunciation dictionary
#
# Term -> spoken form, handed to the text-to-speech voice at render time.
# Only the words a voice gets wrong, and one word it gets wrong in a way that
# matters more than the rest: pi is a harness, not a number, and a concept
# track that says "three point one four" in the first minute has lost the
# listener it was written for.

pi: pie
pi.dev: pie dot dev
