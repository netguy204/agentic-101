# The recall beat that closes each segment of Session 2's concept track.
# Chunk: docs/chunks/platform_module_contract - Session 2 recall prompts
#
# Session 2 is a hands-on session, so these deliberately ask about the *why*
# rather than about steps. A student who can answer all four has everything
# they need to make sense of the lab; a student who can only recite the
# commands has the part the lab card carries for them anyway.

session: 02_meeting_the_harness
prompts:
  - id: what_is_a_terminal
    prompt: >-
      A friend asks where the agent does its work, and how you'd find out what
      it did. What do you tell them?
    model_answer: >-
      It works in a folder of its own, which you can see on the page under Your
      files. Everything it makes or changes is there. And as it works, each
      thing it does appears as a step on the page, so you can watch it read,
      write, change a file or run a command, and then look in the folder for
      the result.
    segment_after: 1

  - id: why_the_safety_net_comes_first
    prompt: >-
      Why does this session teach you to undo things before it lets you run a
      single delegation? And what does that undo not cover?
    model_answer: >-
      Because the agent changes files, and somebody who has only been told the
      safety net exists doesn't believe it, and won't experiment. Once you've
      seen a file come back, you'll try things. Undo puts files in the agent's
      folder back. It doesn't unsend an email, doesn't reach outside that
      folder, and can't pull back anything already sent to the model
      provider.
    segment_after: 2

  - id: what_tool_calls_are
    prompt: >-
      You run your first delegation and only two steps appear on the screen.
      What are those steps, and what does two of them mean?
    model_answer: >-
      They're tool calls, one step for each thing it actually did: read a
      file, wrote a file, changed one, ran a command. They're the closest thing
      to a receipt you'll get. Two is normal. One write is a whole file
      created, and a short list doesn't mean nothing happened.
    segment_after: 3

  - id: the_three_questions
    prompt: >-
      Three questions, in order, after every delegation. What are they — and
      which one is the session actually for?
    model_answer: >-
      What did it do, read off the steps and not off its paragraph. What
      changed in the folder, read off the actual file. And then the one the
      session is for: was that reasonable, and how do I know? The answer to
      the third is the check you already wrote in the How I'd check column of
      your toil inventory sheet, before you'd ever seen the agent.
    segment_after: 4
